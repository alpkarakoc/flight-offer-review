name: Flight Offer Validation Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  client-validation:
    name: Client Check (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check

  server-validation:
    name: Server Check (Spring Boot)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x mvnw
      - name: Execute Server Tests and Package
        run: ./mvnw clean verify
      - name: E2E HTTP Sanity Check
        run: |
          nohup java -jar target/*.jar > server.log 2>&1 &
          echo "Waiting for Spring Boot to start..."
          timeout 30 bash -c 'while ! curl -s http://localhost:8080/api/offers?origin=IST\&destination=LHR\&date=2026-10-20 > /dev/null; do sleep 2; done'
          echo "Server is up! Testing HTTP GET..."
          curl -s -f "http://localhost:8080/api/offers?origin=IST&destination=LHR&date=2026-10-20" | grep "OFFER-1"
          echo "Testing HTTP POST (OFFER_STALE)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"offerId":"OFFER-1","version":1}' http://localhost:8080/api/selections)
          if [ "$HTTP_STATUS" -ne 409 ]; then
            echo "Expected 409, got $HTTP_STATUS"
            cat server.log
            exit 1
          fi
          echo "Sanity check passed."
