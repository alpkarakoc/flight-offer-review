name: Flight Offer Validation Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  client-validation:
    name: Client Check (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Execute Tests and Build
        run: npm run check

  server-validation:
    name: Server Check (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Maven Wrapper is Executable
        run: chmod +x mvnw

      - name: Execute Server Tests
        run: ./mvnw clean test
